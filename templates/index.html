<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PlatformGPT</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-store">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>

  <style>
    :root {
      --bg-color: #f7f7f8;
      --text-color: #0d0d0d;
      --muted: #6b6b6b;
      --surface: #ffffff;
      --header-bg: rgba(247, 247, 248, 0.9);
      --primary: #10a37f;
      --primary-hover: #0e8f6e;
      --user-bubble: #10a37f;
      --assistant-bg: transparent;
      --border: #e5e5e5;
      --code-bg: #f0f0f0;
      --error-bubble: #fde8e8;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
    }

    body.dark {
      --bg-color: #212121;
      --text-color: #ececec;
      --muted: #a0a0a0;
      --surface: #2f2f2f;
      --header-bg: rgba(33, 33, 33, 0.92);
      --primary: #19c37d;
      --primary-hover: #14a86b;
      --user-bubble: #19c37d;
      --assistant-bg: transparent;
      --border: #444;
      --code-bg: #3a3a3a;
      --error-bubble: #3a1e1e;
      --shadow: none;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: Inter, system-ui, -apple-system, Segoe UI, sans-serif;
      background: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1.25rem;
      background: var(--header-bg);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }

    .brand {
      font-size: 1.05rem;
      font-weight: 650;
      letter-spacing: -0.02em;
      margin: 0;
    }

    .toggle-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      color: var(--text-color);
    }

    .toggle-btn:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    .transcript {
      flex: 1;
      overflow-y: auto;
      padding: 1.25rem 1rem 8.5rem;
    }

    .transcript-inner {
      max-width: 48rem;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .welcome {
      text-align: center;
      padding: 3.5rem 1rem 1rem;
    }

    .welcome h2 {
      font-size: 1.7rem;
      font-weight: 650;
      margin: 0 0 0.5rem;
      letter-spacing: -0.03em;
    }

    .welcome p {
      color: var(--muted);
      margin: 0 auto;
      max-width: 34rem;
      line-height: 1.6;
    }

    .starter-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
      margin-top: 1.25rem;
    }

    .chip {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-color);
      border-radius: 999px;
      padding: 0.5rem 0.85rem;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .chip:hover {
      border-color: var(--primary);
    }

    .message {
      max-width: 100%;
      position: relative;
    }

    .user-message {
      align-self: flex-end;
      max-width: min(85%, 36rem);
      background: var(--user-bubble);
      color: #fff;
      padding: 0.75rem 1rem;
      border-radius: 1.15rem 1.15rem 0.25rem 1.15rem;
    }

    .assistant-message {
      align-self: stretch;
      background: var(--assistant-bg);
      padding: 0.15rem 0;
    }

    .error-message {
      background: var(--error-bubble);
      color: #d32f2f;
      padding: 0.85rem 1rem;
      border-radius: 0.9rem;
    }

    .user-text {
      white-space: pre-wrap;
      line-height: 1.55;
    }

    .message-timestamp {
      font-size: 0.75rem;
      opacity: 0.7;
      margin-top: 0.45rem;
    }

    .user-message .message-timestamp {
      color: rgba(255, 255, 255, 0.8);
    }

    .markdown-body {
      font-size: 1rem;
      line-height: 1.65;
      color: var(--text-color);
      overflow-wrap: anywhere;
    }

    .markdown-body h1,
    .markdown-body h2,
    .markdown-body h3,
    .markdown-body h4 {
      font-weight: 650;
      line-height: 1.3;
      color: var(--text-color);
    }

    .markdown-body h1 {
      font-size: 1.45rem;
      margin: 1.1em 0 0.4em;
    }

    .markdown-body h2 {
      font-size: 1.25rem;
      margin: 1em 0 0.4em;
    }

    .markdown-body h3,
    .markdown-body h4 {
      font-size: 1.1rem;
      margin: 0.9em 0 0.35em;
      color: var(--muted);
    }

    .markdown-body h1:first-child,
    .markdown-body h2:first-child,
    .markdown-body h3:first-child,
    .markdown-body h4:first-child,
    .markdown-body p:first-child {
      margin-top: 0;
    }

    .markdown-body p {
      margin: 0.55em 0;
    }

    .markdown-body p:last-child {
      margin-bottom: 0;
    }

    .markdown-body ul,
    .markdown-body ol {
      padding-left: 1.25rem;
      margin: 0.4em 0 0.7em;
    }

    .markdown-body li {
      margin: 0.35em 0;
    }

    .markdown-body li > ul,
    .markdown-body li > ol {
      margin: 0.2em 0 0.35em;
    }

    .markdown-body strong,
    .markdown-body b {
      font-weight: 650;
      color: inherit;
    }

    .markdown-body em {
      font-style: italic;
    }

    .markdown-body code {
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 0.9em;
      background: var(--code-bg);
      padding: 0.12em 0.38em;
      border-radius: 5px;
    }

    .markdown-body pre {
      overflow-x: auto;
      background: var(--code-bg);
      padding: 0.85rem 1rem;
      border-radius: 10px;
    }

    .markdown-body pre code {
      background: none;
      padding: 0;
    }

    .markdown-body hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 1rem 0;
    }

    .markdown-body a {
      color: var(--primary);
      text-decoration: none;
    }

    .markdown-body a:hover {
      text-decoration: underline;
    }

    .diagram-wrap {
      margin-top: 1rem;
      padding: 0.75rem;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
    }

    .diagram-image {
      display: block;
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      background: #fff;
    }

    .diagram-actions {
      display: flex;
      gap: 1rem;
      margin-top: 0.65rem;
    }

    .diagram-link {
      color: var(--primary);
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none;
    }

    .diagram-link:hover {
      text-decoration: underline;
    }

    .composer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 0.75rem 1rem 1.1rem;
      background: linear-gradient(to top, var(--bg-color) 70%, transparent);
    }

    .composer-inner {
      max-width: 48rem;
      margin: 0 auto;
      display: flex;
      gap: 0.55rem;
      align-items: flex-end;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 1.5rem;
      padding: 0.55rem 0.55rem 0.55rem 1rem;
      box-shadow: var(--shadow);
    }

    textarea {
      flex: 1;
      border: none;
      resize: none;
      min-height: 44px;
      max-height: 160px;
      font-size: 1rem;
      line-height: 1.45;
      font-family: inherit;
      background: transparent;
      color: var(--text-color);
    }

    textarea:focus {
      outline: none;
    }

    .composer-inner:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 25%, transparent);
    }

    button[type="submit"] {
      background: var(--primary);
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #fff;
      flex-shrink: 0;
    }

    button[type="submit"]:hover {
      background: var(--primary-hover);
    }

    button[type="submit"]:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    .typing-dots {
      display: flex;
      gap: 5px;
      padding: 0.4rem 0;
    }

    .typing-dots span {
      width: 8px;
      height: 8px;
      background: #999;
      border-radius: 50%;
      animation: bounce 1.2s infinite ease-in-out;
    }

    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    .message-actions {
      margin-top: 0.45rem;
      display: flex;
      gap: 0.35rem;
    }

    .copy-btn,
    .download-btn {
      background: transparent;
      border: 1px solid transparent;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      cursor: pointer;
      color: var(--muted);
    }

    .copy-btn:hover,
    .download-btn:hover {
      background: var(--surface);
      border-color: var(--border);
      color: var(--text-color);
    }
  </style>
</head>
<body>
  <header class="topbar">
    <h1 class="brand">PlatformGPT</h1>
    <button class="toggle-btn" type="button" onclick="toggleDarkMode()" aria-label="Toggle theme">
      <i class="fas fa-moon"></i>
    </button>
  </header>

  <main class="transcript" id="transcript">
    <div class="transcript-inner" id="chatContainer">
      <div class="welcome" id="welcome">
        <h2>PlatformGPT</h2>
        <p>Ask about platform health, failing services, and architecture. I will summarize issues and can show a deployment diagram when you ask why something is happening.</p>
        <div class="starter-chips">
          <button class="chip" type="button" data-prompt="Is everything up with my applications? Give a concise summary of any critical issues.">Check if everything is up</button>
          <button class="chip" type="button" data-prompt="Why is this happening? Visualize the issue with a deployment diagram of the failing component calls.">Visualize failing calls</button>
        </div>
      </div>
    </div>
  </main>

  <div class="composer">
    <form class="composer-inner" id="chatForm">
      <textarea name="question" id="question" required placeholder="Message PlatformGPT..."></textarea>
      <button type="submit" title="Send" aria-label="Send">
        <i class="fas fa-arrow-up"></i>
      </button>
    </form>
  </div>

  <script>
    if (window.marked) {
      marked.setOptions({
        gfm: true,
        breaks: true,
        headerIds: false,
        mangle: false
      });
    }

    if (localStorage.getItem("theme") === "dark") {
      document.body.classList.add("dark");
    }

    function toggleDarkMode() {
      document.body.classList.toggle("dark");
      localStorage.setItem("theme", document.body.classList.contains("dark") ? "dark" : "light");
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    function renderMarkdown(text) {
      const source = text == null ? "" : String(text);
      if (window.marked && window.DOMPurify) {
        const dirty = marked.parse(source);
        return DOMPurify.sanitize(dirty, { USE_PROFILES: { html: true } });
      }
      return escapeHtml(source);
    }

    function scrollToBottom() {
      const transcript = document.getElementById("transcript");
      transcript.scrollTo({ top: transcript.scrollHeight, behavior: "smooth" });
    }

    function getCurrentTime() {
      const now = new Date();
      let hours = now.getHours();
      const minutes = now.getMinutes().toString().padStart(2, "0");
      const ampm = hours >= 12 ? "PM" : "AM";
      hours = hours % 12 || 12;
      return `${hours}:${minutes} ${ampm}`;
    }

    function hideWelcome() {
      const welcome = document.getElementById("welcome");
      if (welcome) welcome.remove();
    }

    const form = document.getElementById("chatForm");
    const textarea = document.getElementById("question");
    const container = document.getElementById("chatContainer");

    document.querySelectorAll(".chip").forEach((chip) => {
      chip.addEventListener("click", () => {
        textarea.value = chip.getAttribute("data-prompt");
        form.dispatchEvent(new Event("submit", { cancelable: true }));
      });
    });

    textarea.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        form.dispatchEvent(new Event("submit", { cancelable: true }));
      }
    });

    form.addEventListener("submit", async function (e) {
      e.preventDefault();
      const userText = textarea.value.trim();
      if (!userText) return;

      hideWelcome();
      const timeNow = getCurrentTime();

      const userBubble = document.createElement("div");
      userBubble.className = "message user-message";
      userBubble.innerHTML = `<div class="user-text">${escapeHtml(userText)}</div><div class="message-timestamp">${timeNow}</div>`;
      container.appendChild(userBubble);
      scrollToBottom();

      const assistantBubble = document.createElement("div");
      assistantBubble.className = "message assistant-message";
      assistantBubble.innerHTML = `<div class="typing-dots"><span></span><span></span><span></span></div>`;
      container.appendChild(assistantBubble);
      scrollToBottom();

      try {
        const formData = new FormData(form);
        const response = await fetch("/ask", {
          method: "POST",
          body: formData
        });
        const data = await response.json();
        textarea.value = "";

        const rendered = renderMarkdown(data.response || "");
        const downloadUrl = data.download_url || "/diagram/download";
        const diagramHtml = data.image_url
          ? `<div class="diagram-wrap">
               <img class="diagram-image" src="${escapeHtml(data.image_url)}?t=${Date.now()}" alt="Architecture diagram">
               <div class="diagram-actions">
                 <a class="diagram-link" href="${escapeHtml(data.image_url)}" target="_blank" rel="noopener">View diagram in browser</a>
                 <a class="diagram-link" href="${escapeHtml(downloadUrl)}">Download image</a>
               </div>
             </div>`
          : "";

        assistantBubble.innerHTML = `
          <div class="markdown-body">${rendered}</div>
          ${diagramHtml}
          <div class="message-timestamp">${escapeHtml(data.timestamp || "")}</div>
          <div class="message-actions">
            <button class="copy-btn" type="button" onclick="copyToClipboard(this)" title="Copy"><i class="fas fa-copy"></i></button>
            <button class="download-btn" type="button" onclick="downloadText(this)" title="Download"><i class="fas fa-download"></i></button>
          </div>
        `;
      } catch (err) {
        assistantBubble.classList.add("error-message");
        assistantBubble.innerHTML = `<div class="markdown-body">Something went wrong. Please try again later.</div>`;
      }

      scrollToBottom();
    });

    function markDone(button) {
      const icon = button.querySelector("i");
      if (!icon) return;
      const original = icon.className;
      icon.className = "fas fa-check";
      setTimeout(() => { icon.className = original; }, 1500);
    }

    function copyToClipboard(button) {
      const contentDiv = button.closest(".assistant-message").querySelector(".markdown-body");
      const text = contentDiv ? contentDiv.innerText : "";
      navigator.clipboard.writeText(text).then(() => markDone(button));
    }

    function downloadText(button) {
      const contentDiv = button.closest(".assistant-message").querySelector(".markdown-body");
      const text = contentDiv ? contentDiv.innerText : "";
      const blob = new Blob([text], { type: "text/plain" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "assistant_response.txt";
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      markDone(button);
    }
  </script>
</body>
</html>
